# Fallback: triggers the daily notification job manually or on a schedule, if Vercel Cron is not available on your plan.
# The job is idempotent (it never sends the same notification twice). Add in GitHub -> Settings -> Secrets -> Actions:
#   SITE_URL (e.g. https://neuron-flame.vercel.app) and CRON_SECRET (same value as in Vercel)
# To enable the schedule instead of manual runs: remove the # from the two schedule lines.
name: notify-backup
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "10 17 * * *"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/notify
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL" && test -n "$CRON_SECRET" || { echo "secrets missing"; exit 1; }
          code=$(curl -s -o body.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/notify")
          echo "status $code"; cat body.txt; echo
          test "$code" = "200"
