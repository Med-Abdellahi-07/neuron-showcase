# يرسل طلباً بسيطاً إلى Supabase كل 3 أيام كي لا يتوقف المشروع المجاني في العطل.
# أضف في GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_URL  و  SUPABASE_ANON_KEY
name: keep-supabase-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "secrets missing"; exit 1; }
          # الوصول المجهول إلى الجداول ممنوع عمداً (401/403 متوقع)؛ المهم أن الطلب وصل ولم يفشل الخادم (5xx).
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/semesters?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "status $code"
          test "$code" -gt 0 && test "$code" -lt 500
