# Calls public.ping() in Supabase every 3 days (a real database query)
# so the free-tier project is not paused during quiet periods. Requires supabase/migrations/0004_ping.sql to be applied first.
# Add in GitHub -> Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL and SUPABASE_ANON_KEY
name: keep-supabase-alive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "secrets missing"; exit 1; }
          url="${SUPABASE_URL%/}/rest/v1/rpc/ping"
          # New-style keys (sb_publishable_...) are not JWTs: send them in apikey only.
          # Legacy keys (eyJ...) are also sent in Authorization.
          if [[ "$SUPABASE_ANON_KEY" == eyJ* ]]; then
            code=$(curl -s -o body.txt -w "%{http_code}" -X POST "$url" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" -d '{}')
          else
            code=$(curl -s -o body.txt -w "%{http_code}" -X POST "$url" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          fi
          echo "status $code"
          cat body.txt; echo
          test "$code" = "200" || { echo "::error::ping did not return 200 (did you run 0004_ping.sql?)"; exit 1; }
